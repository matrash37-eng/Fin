<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Финансы</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ground: #000000;
    --surface: rgba(255,255,255,.06);
    --raised: rgba(255,255,255,.11);
    --line: rgba(255,255,255,.09);
    --ink: #F2F0F7;
    --muted: #9A97A6;
    --faint: #66636F;
    --inc: #8FD4B4;
    --exp: #F0A3B0;
    --violet: #9D7BFF;
    --violet-2: #C4A8FF;
    --violet-tint: rgba(157,123,255,.18);
    --focus: #B9A0FF;
    --glass: rgba(14,12,22,.30);
    --r: 10px;
    --pad: 20px;
    color-scheme: dark;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { background: #000; } body { background: transparent; }
  body {
    margin: 0; color: var(--ink);
    font: 400 15px/1.45 "Onest", -apple-system, "Segoe UI", Roboto, sans-serif;
    font-feature-settings: "tnum" 1;
    padding-bottom: calc(96px + env(safe-area-inset-bottom));
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .bg { position: fixed; inset: 0; z-index: -1; background: #000 url("bg.jpg") center 30% / cover no-repeat; }
  .bg::after { content: ""; position: absolute; inset: 0;
    background: radial-gradient(120% 60% at 85% 0%, rgba(157,123,255,.22), transparent 60%),
                linear-gradient(to bottom, rgba(0,0,0,0), rgba(0,0,0,.1) 60%, rgba(0,0,0,.45)); }
  .glass { background: var(--glass); -webkit-backdrop-filter: blur(16px) saturate(160%); backdrop-filter: blur(16px) saturate(160%);
           border: 1px solid rgba(255,255,255,.08); border-radius: 22px; padding: 20px; margin-bottom: 14px; }
  .wrap { max-width: 520px; margin: 0 auto; padding: 0 var(--pad); }

  /* шапка: месяц */
  .top { display: flex; align-items: center; justify-content: space-between; padding: 18px 0 6px; }
  .month { font-size: 15px; font-weight: 500; color: var(--ink); }
  .month::first-letter { text-transform: uppercase; }
  .nav { display: flex; gap: 4px; }
  .nav button { width: 40px; height: 40px; border-radius: 50%; color: var(--muted); font-size: 20px; transition: background .15s, color .15s, transform .1s; }
  .nav button { background: var(--surface); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); }
  .nav button:hover { color: var(--ink); background: var(--raised); }
  .nav button:active { transform: scale(.92); }

  /* главный элемент: баланс */
  .hero { padding: 22px 20px 20px; margin-top: 8px; }
  .hero .lbl { color: var(--muted); font-size: 14px; }
  .balance { background: linear-gradient(100deg, #FFFFFF 30%, var(--violet-2)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    font-size: clamp(40px, 12.5vw, 56px); font-weight: 300; letter-spacing: -0.035em; line-height: 1.05; margin: 6px 0 22px; white-space: nowrap; }
  .balance .cur { -webkit-text-fill-color: var(--faint); color: var(--faint); font-weight: 300; margin-left: .12em; }
  .ribbon { display: flex; height: 6px; gap: 3px; margin-bottom: 14px; }
  .ribbon i { display: block; height: 100%; border-radius: 3px; transition: flex-grow .5s cubic-bezier(.2,.8,.2,1); min-width: 0; }
  .ribbon .ri { background: var(--inc); }
  .ribbon .re { background: var(--exp); }
  .ribbon.empty i { background: var(--raised); }
  .pair { display: flex; justify-content: space-between; gap: 16px; }
  .pair div { font-size: 13px; color: var(--muted); }
  .pair b { display: block; font-size: 19px; font-weight: 500; letter-spacing: -0.01em; color: var(--ink); margin-top: 2px; }
  .pair .r { text-align: right; }
  .pair .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }
  .alltime { margin-top: 16px; font-size: 13px; color: var(--faint); }
  .alltime span { color: var(--muted); }

  section.glass { padding-bottom: 10px; }
  .sec-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  h2 { font-size: 17px; font-weight: 500; margin: 0; letter-spacing: -0.01em; white-space: nowrap; }

  .seg { display: inline-flex; background: var(--surface); border-radius: 9px; padding: 3px; }
  .seg button { padding: 6px 12px; min-height: 32px; border-radius: 7px; font-size: 13px; color: var(--muted); transition: background .15s, color .15s; }
  .seg button.on { background: var(--violet-tint); color: #E9E0FF; box-shadow: inset 0 0 0 1px rgba(157,123,255,.35); }

  /* категории */
  .stack { display: flex; height: 10px; gap: 2px; margin-bottom: 18px; border-radius: 5px; overflow: hidden; }
  .stack i { display: block; height: 100%; min-width: 3px; }
  .cat { display: grid; grid-template-columns: 10px 1fr 40px 118px; align-items: center; gap: 12px; padding: 9px 0; }
  .cat .d { width: 8px; height: 8px; border-radius: 50%; }
  .cat .n { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cat .p { color: var(--faint); font-size: 13px; width: 38px; text-align: right; }
  .cat .s { font-weight: 500; text-align: right; }

  /* операции */
  .day { display: flex; justify-content: space-between; color: var(--faint); font-size: 13px; padding: 16px 0 6px; }
  .day:first-child { padding-top: 0; }
  .tx { display: grid; grid-template-columns: 10px 1fr auto; align-items: center; gap: 12px; padding: 10px 0; width: 100%; text-align: left; border-radius: 6px; transition: background .15s; }
  .tx:hover { background: rgba(255,255,255,.02); }
  .tx:active { background: var(--violet-tint); }
  .tx .d { width: 8px; height: 8px; border-radius: 50%; }
  .tx .m { min-width: 0; }
  .tx .n { display: block; }
  .tx .o { display: block; color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tx .s { font-weight: 500; white-space: nowrap; }
  .tx .s.in { color: var(--inc); }
  .empty { color: var(--muted); padding: 8px 0 20px; font-size: 14px; }

  /* нижняя панель */
  .bar { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px var(--pad) calc(12px + env(safe-area-inset-bottom));
         background: linear-gradient(to top, rgba(0,0,0,.85) 55%, rgba(0,0,0,0)); z-index: 5; }
  .bar .wrap { display: flex; gap: 10px; padding: 0; }
  .btn { min-height: 52px; border-radius: 16px; font-weight: 500; font-size: 15px; padding: 0 18px; transition: transform .1s, background .15s, opacity .15s; }
  .btn:active { transform: scale(.97); }
  .btn-main { flex: 1; color: #fff; font-weight: 600; background: linear-gradient(135deg, #8A63FF, #B38BFF);
              box-shadow: 0 10px 28px -8px rgba(140,99,255,.7), inset 0 1px 0 rgba(255,255,255,.25); }
  .btn-main:hover { filter: brightness(1.08); }
  .btn-quiet { background: rgba(30,28,40,.55); color: var(--ink); border: 1px solid rgba(255,255,255,.1);
               -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px); }
  .btn-quiet:hover { background: rgba(45,42,60,.6); }
  .btn-danger { width: 100%; color: var(--exp); margin-top: 6px; }

  /* шторка */
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.55); -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 10; }
  .overlay.show { opacity: 1; pointer-events: auto; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; max-width: 520px; margin: 0 auto; background: rgba(20,18,28,.88); -webkit-backdrop-filter: blur(30px) saturate(150%); backdrop-filter: blur(30px) saturate(150%);
           border: 1px solid rgba(255,255,255,.08); border-bottom: 0; border-radius: 24px 24px 0 0; padding: 10px var(--pad) calc(20px + env(safe-area-inset-bottom));
           transform: translateY(102%); transition: transform .28s cubic-bezier(.2,.8,.2,1); z-index: 11; max-height: 92vh; overflow-y: auto; }
  .sheet.show { transform: none; }
  .grip { width: 36px; height: 4px; border-radius: 2px; background: var(--line); margin: 0 auto 14px; }
  .sheet .head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .sheet .head h2 { font-size: 17px; }
  .x { width: 36px; height: 36px; border-radius: 50%; color: var(--muted); background: var(--raised); font-size: 15px; }
  .sheet .seg { display: flex; margin-bottom: 8px; background: rgba(0,0,0,.35); }
  .sheet .seg button { flex: 1; }
  .amount { width: 100%; background: transparent; border: 0; outline: none; color: var(--ink); caret-color: var(--violet); text-align: center;
            font: 300 46px/1.1 "Onest", sans-serif; letter-spacing: -0.03em; padding: 18px 0 20px; font-feature-settings: "tnum" 1; }
  .amount:focus-visible { outline: none; }
  .amount::placeholder { color: var(--faint); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  .chip { display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 14px; border-radius: 20px; background: rgba(0,0,0,.35); color: var(--muted); font-size: 14px; border: 1px solid transparent; transition: color .15s, border-color .15s; }
  .chip i { width: 7px; height: 7px; border-radius: 50%; }
  .chip.on { color: #EFE8FF; border-color: rgba(157,123,255,.7); background: var(--violet-tint); }
  .field { width: 100%; background: rgba(0,0,0,.35); border: 1px solid transparent; border-radius: var(--r); padding: 14px; font: inherit; color: var(--ink); margin-bottom: 10px; outline: none; }
  .field:focus { border-color: rgba(157,123,255,.5); }
  .field::placeholder { color: var(--faint); }
  .sheet .btn-main { width: 100%; margin-top: 6px; }
  .note { color: var(--muted); font-size: 13px; margin: 0 0 14px; }
  .pv-pair { margin-bottom: 18px; }
  .pv-list { max-height: 44vh; overflow-y: auto; margin: 0 -4px 14px; padding: 0 4px; }
  .pv-list .tx { cursor: default; }
  .pv-list .dup { opacity: .35; }
  .loading { color: var(--muted); padding: 36px 0; text-align: center; }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="bg" aria-hidden="true"></div>
<div class="wrap">
  <header class="top">
    <div class="month" id="periodTitle"></div>
    <div class="nav">
      <button id="prev" aria-label="Предыдущий месяц">‹</button>
      <button id="next" aria-label="Следующий месяц">›</button>
    </div>
  </header>

  <div class="hero glass">
    <div class="lbl">Осталось за месяц</div>
    <div class="balance" id="balance">0<span class="cur">₽</span></div>
    <div class="ribbon empty" id="ribbon"><i class="ri" style="flex-grow:1"></i><i class="re" style="flex-grow:1"></i></div>
    <div class="pair">
      <div><span class="dot" style="background:var(--inc)"></span>Заработал<b id="totalInc">0 ₽</b></div>
      <div class="r"><span class="dot" style="background:var(--exp)"></span>Потратил<b id="totalExp">0 ₽</b></div>
    </div>
    <div class="alltime">На счету за всё время: <span id="allTime">0 ₽</span></div>
  </div>

  <section class="glass">
    <div class="sec-head">
      <h2>По категориям</h2>
      <div class="seg" id="statTabs">
        <button data-t="exp" class="on">Расходы</button>
        <button data-t="inc">Доходы</button>
      </div>
    </div>
    <div id="cats"></div>
  </section>

  <section class="glass">
    <div class="sec-head"><h2>Операции</h2></div>
    <div id="list"></div>
  </section>
</div>

<div class="bar">
  <div class="wrap">
    <button class="btn btn-quiet" id="importBtn">Загрузить выписку</button>
    <button class="btn btn-main" id="addBtn">Добавить</button>
  </div>
</div>
<input type="file" id="fileInput" accept="application/pdf,.pdf" hidden>

<div class="overlay" id="overlay"></div>
<div class="sheet" id="sheet" role="dialog" aria-labelledby="sheetTitle">
  <div class="grip"></div>
  <div class="head"><h2 id="sheetTitle">Новая операция</h2><button class="x" id="closeBtn" aria-label="Закрыть">✕</button></div>
  <div class="seg" id="typeTabs">
    <button data-t="exp" class="on">Расход</button>
    <button data-t="inc">Доход</button>
  </div>
  <input class="amount" id="amount" type="text" inputmode="decimal" placeholder="0 ₽" autocomplete="off" aria-label="Сумма">
  <div class="chips" id="catPicker"></div>
  <input class="field" id="note" type="text" placeholder="Комментарий" maxlength="60" aria-label="Комментарий">
  <input class="field" id="date" type="date" aria-label="Дата">
  <button class="btn btn-main" id="saveBtn">Сохранить</button>
  <button class="btn btn-danger" id="delBtn" hidden>Удалить операцию</button>
</div>

<div class="sheet" id="pvSheet" role="dialog" aria-labelledby="pvTitle">
  <div class="grip"></div>
  <div class="head"><h2 id="pvTitle">Выписка</h2><button class="x" id="pvClose" aria-label="Закрыть">✕</button></div>
  <div id="pvBody"></div>
</div>

<script>
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) {
  tg.ready(); tg.expand();
  try { tg.setHeaderColor('#000000'); tg.setBackgroundColor('#000000'); tg.setBottomBarColor && tg.setBottomBarColor('#000000'); } catch (e) {}
}

const CATS = {
  exp: [
    ['🛒','Продукты'],['🍔','Кафе'],['🚕','Транспорт'],['🏠','Жильё'],
    ['💡','Связь и ЖКХ'],['👕','Одежда'],['💊','Здоровье'],['🎮','Развлечения'],
    ['🎁','Подарки'],['📚','Обучение'],['🐾','Питомцы'],['📦','Другое'],
    ['💸','Переводы'],['🏧','Наличные'],['🚗','Автомобиль'],['🛋️','Дом']
  ],
  inc: [
    ['💼','Зарплата'],['💻','Фриланс'],['📈','Инвестиции'],['🎁','Подарок'],
    ['↩️','Возврат'],['🏷️','Продажа'],['💰','Другое'],
    ['💸','Переводы'],['🏦','Проценты']
  ]
};
// индексы категорий (новые добавлять только в конец списков!)
const E = {food:0, cafe:1, transport:2, home:3, utils:4, clothes:5, health:6, fun:7, gifts:8, edu:9, pets:10, other:11, transfer:12, cash:13, car:14, house:15};
const I = {salary:0, freelance:1, invest:2, gift:3, refund:4, sale:5, other:6, transfer:7, interest:8};
const COLORS = ['#A98BFF','#7FB2F0','#8FD4B4','#E6C590','#D68FD6','#F0A3B0','#A9CC8E','#F2B48A','#7FD0E0','#C7A38F','#B5C77E','#9A97A6','#C9B4FF','#8CC7A8','#C9A86A','#B0BCE8'];
const COLORS_INC = ['#8FD4B4','#9DC3E6','#D4BE7E','#E3A77F','#A9CC8E','#7FC4D4','#9AA3AE','#B8D4A0','#C7A38F'];

// ---------- Storage (Telegram CloudStorage, fallback localStorage) ----------
const CHUNK = 3900;
const hasCloud = !!(tg && tg.CloudStorage && tg.isVersionAtLeast && tg.isVersionAtLeast('6.9'));

function cloudGet(keys) {
  return new Promise((res, rej) => tg.CloudStorage.getItems(keys, (e, v) => e ? rej(e) : res(v)));
}
function cloudSet(k, v) {
  return new Promise((res, rej) => tg.CloudStorage.setItem(k, v, (e) => e ? rej(e) : res()));
}
function cloudDel(keys) {
  return new Promise((res) => tg.CloudStorage.removeItems(keys, () => res()));
}

// compact row: [id, type(0 exp / 1 inc), amount, catIndex, timestamp(sec), note]
let tx = [];

async function load() {
  try {
    if (hasCloud) {
      const meta = await cloudGet(['n']);
      const n = parseInt(meta.n || '0', 10);
      if (n > 0) {
        const keys = Array.from({length: n}, (_, i) => 'd' + i);
        const parts = await cloudGet(keys);
        tx = JSON.parse(keys.map(k => parts[k] || '').join('') || '[]');
      }
    } else {
      tx = JSON.parse(localStorage.getItem('fin_tx') || '[]');
    }
  } catch (e) { console.error(e); tx = []; }
}

let saving = Promise.resolve();
function persist() {
  const data = JSON.stringify(tx);
  saving = saving.then(async () => {
    try {
      if (hasCloud) {
        const old = parseInt((await cloudGet(['n'])).n || '0', 10);
        const chunks = [];
        for (let i = 0; i < data.length; i += CHUNK) chunks.push(data.slice(i, i + CHUNK));
        for (let i = 0; i < chunks.length; i++) await cloudSet('d' + i, chunks[i]);
        await cloudSet('n', String(chunks.length));
        if (old > chunks.length) {
          await cloudDel(Array.from({length: old - chunks.length}, (_, i) => 'd' + (chunks.length + i)));
        }
      } else {
        localStorage.setItem('fin_tx', data);
      }
    } catch (e) {
      console.error(e);
      if (tg) tg.showAlert('Не удалось сохранить данные. Проверьте соединение.');
    }
  });
  return saving;
}

// ---------- Helpers ----------
const fmtNum = n => { const v = Math.round(n * 100) / 100; return v.toLocaleString('ru-RU', {minimumFractionDigits: v % 1 ? 2 : 0, maximumFractionDigits: 2}); };
const fmt = n => fmtNum(n) + ' ₽';
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const typeKey = t => t === 1 ? 'inc' : 'exp';
const haptic = (kind) => { try { tg && tg.HapticFeedback.notificationOccurred(kind); } catch (e) {} };
function toInputDate(d) {
  const p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
}

// ---------- State ----------
const now = new Date();
let viewY = now.getFullYear(), viewM = now.getMonth();
let statType = 'exp';
let formType = 'exp', formCat = 0, editingId = null;

function monthTx() {
  return tx.filter(r => { const d = new Date(r[4] * 1000); return d.getFullYear() === viewY && d.getMonth() === viewM; });
}

// ---------- Render ----------
const catColor = (k, i) => (k === 'inc' ? COLORS_INC : COLORS)[i % (k === 'inc' ? COLORS_INC : COLORS).length];
const money = n => fmtNum(Math.abs(n));

function render() {
  const title = new Date(viewY, viewM, 1).toLocaleDateString('ru-RU', {month: 'long', year: 'numeric'}).replace(' г.', '');
  document.getElementById('periodTitle').textContent = title;

  const list = monthTx();
  let inc = 0, exp = 0;
  list.forEach(r => r[1] === 1 ? inc += r[2] : exp += r[2]);
  const bal = inc - exp;
  document.getElementById('balance').innerHTML = (bal < 0 ? '−' : '') + money(bal) + '<span class="cur">₽</span>';
  document.getElementById('totalInc').textContent = fmt(inc);
  document.getElementById('totalExp').textContent = fmt(exp);
  const rb = document.getElementById('ribbon');
  rb.classList.toggle('empty', !(inc || exp));
  rb.children[0].style.flexGrow = inc || exp ? inc : 1;
  rb.children[1].style.flexGrow = inc || exp ? exp : 1;

  let all = 0; tx.forEach(r => all += r[1] === 1 ? r[2] : -r[2]);
  document.getElementById('allTime').textContent = (all < 0 ? '−' : '') + fmt(Math.abs(all));

  // категории
  const t = statType === 'inc' ? 1 : 0;
  const sums = {};
  let total = 0;
  list.filter(r => r[1] === t).forEach(r => { sums[r[3]] = (sums[r[3]] || 0) + r[2]; total += r[2]; });
  const rows = Object.entries(sums).sort((a, b) => b[1] - a[1]);
  const catsEl = document.getElementById('cats');
  if (!rows.length) {
    catsEl.innerHTML = `<div class="empty">${t ? 'Доходов' : 'Расходов'} в этом месяце нет.</div>`;
  } else {
    catsEl.innerHTML = `<div class="stack">${rows.map(([ci, s]) => `<i style="flex-grow:${s};background:${catColor(statType, +ci)}"></i>`).join('')}</div>` +
      rows.map(([ci, s]) => {
        const c = CATS[statType][ci] || ['', '—'];
        const pct = total ? Math.round(s / total * 100) : 0;
        return `<div class="cat"><span class="d" style="background:${catColor(statType, +ci)}"></span><span class="n">${c[1]}</span><span class="p">${pct}%</span><span class="s">${fmt(s)}</span></div>`;
      }).join('');
  }

  // операции по дням
  const listEl = document.getElementById('list');
  if (!list.length) {
    listEl.innerHTML = '<div class="empty">В этом месяце операций нет. Добавьте первую вручную или загрузите выписку из СберОнлайн.</div>';
    return;
  }
  const sorted = [...list].sort((a, b) => b[4] - a[4] || b[0] - a[0]);
  const byDay = [];
  sorted.forEach(r => {
    const d = new Date(r[4] * 1000);
    const key = d.toDateString();
    let g = byDay[byDay.length - 1];
    if (!g || g.key !== key) { g = {key, d, rows: [], net: 0}; byDay.push(g); }
    g.rows.push(r); g.net += r[1] === 1 ? r[2] : -r[2];
  });
  listEl.innerHTML = byDay.map(g => {
    const dayStr = g.d.toLocaleDateString('ru-RU', {day: 'numeric', month: 'long', weekday: 'short'});
    return `<div class="day"><span>${dayStr}</span><span>${g.net > 0 ? '+' : g.net < 0 ? '−' : ''}${fmt(Math.abs(g.net))}</span></div>` +
      g.rows.map(r => txRow(r)).join('');
  }).join('');
}

function txRow(r, extraClass = '', tag = 'button') {
  const k = typeKey(r[1]);
  const c = CATS[k][r[3]] || ['', '—'];
  return `<${tag} class="tx ${extraClass}" data-id="${r[0]}"><span class="d" style="background:${catColor(k, r[3])}"></span>
    <span class="m"><span class="n">${c[1]}</span>${r[5] ? `<span class="o">${esc(r[5])}</span>` : ''}</span>
    <span class="s ${r[1] === 1 ? 'in' : ''}">${r[1] === 1 ? '+' : '−'}${fmt(r[2])}</span></${tag}>`;
}

// ---------- Form ----------
function renderCatPicker() {
  document.getElementById('catPicker').innerHTML = CATS[formType].map((c, i) =>
    `<button class="chip ${i === formCat ? 'on' : ''}" data-i="${i}"><i style="background:${catColor(formType, i)}"></i>${c[1]}</button>`).join('');
  document.querySelectorAll('#typeTabs button').forEach(b => b.classList.toggle('on', b.dataset.t === formType));
}

function openSheet(row) {
  editingId = row ? row[0] : null;
  formType = row ? typeKey(row[1]) : 'exp';
  formCat = row ? row[3] : 0;
  document.getElementById('sheetTitle').textContent = row ? 'Редактирование' : 'Новая операция';
  document.getElementById('amount').value = row ? String(row[2]).replace('.', ',') : '';
  document.getElementById('note').value = row ? row[5] || '' : '';
  const defDate = row ? new Date(row[4] * 1000)
    : (viewY === now.getFullYear() && viewM === now.getMonth() ? new Date() : new Date(viewY, viewM, 1));
  document.getElementById('date').value = toInputDate(defDate);
  document.getElementById('delBtn').hidden = !row;
  renderCatPicker();
  document.getElementById('overlay').classList.add('show');
  document.getElementById('sheet').classList.add('show');
  if (!row) setTimeout(() => document.getElementById('amount').focus(), 250);
}
function closeSheet() {
  document.getElementById('overlay').classList.remove('show');
  document.getElementById('sheet').classList.remove('show');
  document.getElementById('pvSheet').classList.remove('show');
  document.activeElement && document.activeElement.blur();
}

function save() {
  const raw = document.getElementById('amount').value.replace(/\s/g, '').replace(',', '.');
  const amount = Math.round(parseFloat(raw) * 100) / 100;
  if (!amount || amount <= 0 || !isFinite(amount)) {
    haptic('error');
    tg ? tg.showAlert('Введите сумму больше нуля') : alert('Введите сумму больше нуля');
    return;
  }
  const dv = document.getElementById('date').value;
  const [y, m, d] = dv ? dv.split('-').map(Number) : [now.getFullYear(), now.getMonth() + 1, now.getDate()];
  const ts = Math.floor(new Date(y, m - 1, d, 12).getTime() / 1000);
  const note = document.getElementById('note').value.trim().slice(0, 60);
  const t = formType === 'inc' ? 1 : 0;

  if (editingId) {
    const r = tx.find(x => x[0] === editingId);
    if (r) { r[1] = t; r[2] = amount; r[3] = formCat; r[4] = ts; r[5] = note; }
  } else {
    tx.push([Date.now(), t, amount, formCat, ts, note]);
  }
  // jump to month of the saved operation
  viewY = y; viewM = m - 1;
  persist();
  haptic('success');
  closeSheet();
  render();
}

function remove() {
  const doIt = () => {
    tx = tx.filter(x => x[0] !== editingId);
    persist(); haptic('warning'); closeSheet(); render();
  };
  if (tg && tg.showConfirm) tg.showConfirm('Удалить эту операцию?', ok => ok && doIt());
  else if (confirm('Удалить эту операцию?')) doIt();
}

document.getElementById('addBtn').onclick = () => openSheet(null);

document.getElementById('overlay').onclick = closeSheet;
document.getElementById('saveBtn').onclick = save;

// ================= Импорт выписки Сбера (PDF) =================
const PDFJS = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
let pdfjsReady = null;
function loadPdfJs() {
  if (!pdfjsReady) pdfjsReady = new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = PDFJS + 'pdf.min.js';
    s.onload = () => { window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS + 'pdf.worker.min.js'; res(window.pdfjsLib); };
    s.onerror = () => { pdfjsReady = null; rej(new Error('Не удалось загрузить модуль чтения PDF. Проверьте интернет.')); };
    document.head.appendChild(s);
  });
  return pdfjsReady;
}

// PDF -> массив строк (элементы группируются по вертикали, сортируются слева направо)
async function pdfToLines(file) {
  const lib = await loadPdfJs();
  const pdf = await lib.getDocument({data: await file.arrayBuffer()}).promise;
  const lines = [];
  for (let p = 1; p <= pdf.numPages; p++) {
    const content = await (await pdf.getPage(p)).getTextContent();
    const groups = [];
    content.items.forEach(it => {
      if (!it.str || !it.str.trim()) return;
      const x = it.transform[4], y = it.transform[5];
      let g = groups.find(g => Math.abs(g.y - y) <= 3);
      if (!g) { g = {y, items: []}; groups.push(g); }
      g.items.push({x, w: it.width || 0, s: it.str});
    });
    groups.sort((a, b) => b.y - a.y).forEach(g => {
      g.items.sort((a, b) => a.x - b.x);
      let line = '', end = null;
      g.items.forEach(it => {
        if (end !== null) { const gap = it.x - end; line += gap > 8 ? '\t' : gap > 1 ? ' ' : ''; }
        line += it.s; end = it.x + it.w;
      });
      lines.push(line.replace(/[   ]+/g, ' ').trim());
    });
  }
  return lines;
}

const RE_START = /^(\d{2})\.(\d{2})\.(\d{4})\s+(\d{2}):(\d{2})(?::\d{2})?\b\s*(.*)$/;
const RE_AMT = /([+\-−–]?\s?\d{1,3}(?:[   ]\d{3})*[.,]\d{2})(?!\d)/g;
const RE_NOISE = /продолжение на след|страница \d|^\d+\s*из\s*\d+$|дата операции|дата обработки|сумма в валюте|остаток средств|остаток на|описание операции|код авторизации|итого|выписка по|расшифровка операций|пао сбербанк|генеральная лицензия|www\.sberbank/i;
const parseAmt = s => parseFloat(s.replace(/[+\-−–\s  ]/g, '').replace(',', '.'));

function parseSber(lines) {
  const ops = [];
  let cur = null;
  const flush = () => { if (cur) ops.push(cur); cur = null; };
  for (const raw of lines) {
    const line = raw.replace(/\t/g, ' ').trim();
    const m = line.match(RE_START);
    if (m) {
      // новая операция: дата, время, [дата обработки], [код авторизации], категория, сумма, остаток
      let rest = m[6].replace(/^\d{2}\.\d{2}\.\d{4}\s*/, '').replace(/^\d{6}\s+/, '');
      const amts = [...rest.matchAll(RE_AMT)];
      if (!amts.length) continue;
      flush();
      const a = amts[0];
      cur = {
        d: new Date(+m[3], +m[2] - 1, +m[1], +m[4], +m[5]),
        amtStr: a[1].replace(/\s/g, ''),
        amount: parseAmt(a[1]),
        plus: /^\s*\+/.test(a[1]),
        cat: rest.slice(0, a.index).trim(),
        desc: []
      };
      continue;
    }
    if (!cur || RE_NOISE.test(line) || cur.desc.length >= 3) continue;
    // вторая строка обычно: "дата код_авторизации Описание"
    const d = line.replace(/^\d{2}\.\d{2}\.\d{4}\s*/, '').replace(/^\d{6}\b\s*/, '').trim();
    if (d && !/^[+\-−–]?\s?\d{1,3}(?:\s\d{3})*[.,]\d{2}$/.test(d)) cur.desc.push(d);
  }
  flush();
  return ops.filter(o => o.amount > 0 && isFinite(o.amount));
}

const RX = (s) => new RegExp(s, 'i');
const EXP_RULES = [
  [E.cash, RX('выдача налич|снятие налич|банкомат|\\batm\\b')],
  [E.car, RX('автомобил|азс|топлив|бензин|лукойл|lukoil|газпромнефт|gazpromneft|роснефт|rosneft|shell|татнефт|tatneft|автомойк|шиномонтаж|автосервис|гибдд|осаго|каско')],
  [E.transport, RX('транспорт|такси|taxi|uber|yandex\\s?go|яндекс\\s?go|метрополит|mosmetro|тройка|troika|ржд|rzd|аэрофлот|aeroflot|авиа|победа|pobeda|s7|автобус|парковк|parking|whoosh|urent|делимобил|каршеринг|citydrive|belkacar')],
  [E.cafe, RX('ресторан|кафе|cafe|кофе|coffee|кофейн|фастфуд|фаст-фуд|быстрое питание|kfc|ростикс|burger|бургер|макдон|вкусно и точка|vkusno|теремок|шоколадниц|додо|dodo|пицц|pizza|суши|sushi|яндекс еда|eda\\.yandex|delivery club|столов|starbucks|cofix|surf coffee')],
  [E.food, RX('супермаркет|продукт|магнит|magnit|пят[её]рочк|pyaterochka|перекр[её]ст|perekrestok|ашан|auchan|лента|lenta|вкусвилл|vkusvill|дикси|dixy|азбука вкуса|глобус|globus|самокат|samokat|окей|o.key|spar|fix price|фикс прайс|красное.{0,3}белое|krasnoe|бристоль|чижик|магнолия|верный|metro c&c|метро кэш|ozon fresh|купер|kuper|сбермаркет|sbermarket')],
  [E.utils, RX('коммунал|жкх|связь|интернет|мобильн|\\bмтс\\b|\\bmts\\b|билайн|beeline|мегафон|megafon|tele2|теле2|ростелеком|rostelecom|электроэнерг|мосэнерго|энергосбыт|водоканал|квартплат|yota|сбермобайл|т-мобайл')],
  [E.health, RX('здоровье|аптек|apteka|клиник|медицин|стоматолог|красот|салон|ригла|горздрав|eapteka|лаборатор|инвитро|invitro|гемотест|косметик|золотое яблоко|летуаль|рив гош|барбер|barber')],
  [E.clothes, RX('одежд|обув|аксессуар|zara|uniqlo|спортмастер|sportmaster|gloria jeans|befree|o.stin|остин|lamoda|ламода|reserved|love republic|zarina|befree|кари|kari|детский мир')],
  [E.house, RX('все для дома|для дома|дом и ремонт|ремонт|леруа|lemana|леман|икеа|ikea|hoff|\\bobi\\b|петрович|максидом|строител|мебел|хозтовар|бытовая техник|м\\.видео|mvideo|эльдорадо|eldorado|dns|днс')],
  [E.fun, RX('отдых|развлечен|кино|cinema|театр|концерт|музей|steam|playstation|xbox|spotify|кинопоиск|kinopoisk|okko|\\bivi\\b|яндекс плюс|plus\\.yandex|подписк|apple\\.com|itunes|google|netflix|боулинг|цифровые товары|игр')],
  [E.edu, RX('образован|обучени|курс|школ|универс|книг|литрес|litres|skillbox|нетология|практикум|geekbrains|читай-город|буквоед')],
  [E.pets, RX('животн|зоомагаз|ветеринар|ветклиник|четыре лапы|бетховен|зоо')],
  [E.gifts, RX('подар|цвет|flowers|flowwow')],
  [E.home, RX('аренд|ипотек|квартир')],
  [E.transfer, RX('перевод|сбп|p2p|card2card|с карты на карту')]
];
const INC_RULES = [
  [I.salary, RX('зарплат|заработн|аванс|пенси|пособи|стипенд')],
  [I.refund, RX('возврат|отмена|кэшб[эе]к|cashback|бонус|компенсац')],
  [I.interest, RX('процент|капитализ|вклад|накопит')],
  [I.invest, RX('дивиденд|купон|брокер')],
  [I.transfer, RX('перевод|сбп|внесени|пополнен|зачислен')]
];
const RE_INCOME_WORDS = RX('зарплат|заработн|пенси|пособи|стипенд|возврат|отмена|кэшб[эе]к|cashback|капитализ|проценты|перевод на карту|перевод от|внесение налич|зачислен|поступлен|пополнени');

function categorize(text, isInc) {
  const rules = isInc ? INC_RULES : EXP_RULES;
  for (const [idx, re] of rules) if (re.test(text)) return idx;
  return isInc ? I.other : E.other;
}
function hashKey(s) { let h = 5381; for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0; return (h >>> 0).toString(36); }

let pending = [];
let lastLines = [];

async function handleFile(file) {
  openPv('<div class="loading">Читаю выписку…</div>');
  try {
    lastLines = await pdfToLines(file);
    const ops = parseSber(lastLines);
    if (!ops.length) return showParseFail();
    const anyPlus = ops.some(o => o.plus);
    const existing = new Set(tx.map(r => r[6]).filter(Boolean));
    let seq = 0;
    pending = ops.map(o => {
      const desc = o.desc.join(' ').replace(/\s+/g, ' ').trim();
      const text = (o.cat + ' ' + desc).toLowerCase();
      const isInc = anyPlus ? o.plus : RE_INCOME_WORDS.test(text);
      const key = hashKey([+o.d, o.amtStr, isInc ? 1 : 0, desc || o.cat].join('|'));
      const note = (desc || o.cat).slice(0, 60);
      return {row: [Date.now() * 1000 + (seq++), isInc ? 1 : 0, Math.round(o.amount * 100) / 100,
                    categorize(text, isInc), Math.floor(+o.d / 1000), note, key],
              dup: existing.has(key)};
    });
    // убираем дубли внутри самой выписки
    const seen = new Set();
    pending.forEach(p => { if (seen.has(p.row[6])) p.dup = true; seen.add(p.row[6]); });
    showPreview();
  } catch (e) {
    console.error(e);
    openPv(`<div class="empty">Не получилось открыть файл: ${esc(e.message || e)}</div>`);
  }
}

const plural = (n, a, b, c) => { const m = n % 10, mm = n % 100; return m === 1 && mm !== 11 ? a : m >= 2 && m <= 4 && (mm < 10 || mm >= 20) ? b : c; };

function showPreview() {
  const fresh = pending.filter(p => !p.dup);
  let inc = 0, exp = 0;
  fresh.forEach(p => p.row[1] ? inc += p.row[2] : exp += p.row[2]);
  const dups = pending.length - fresh.length;
  const items = [...pending].sort((a, b) => b.row[4] - a.row[4]).slice(0, 200)
    .map(p => txRow(p.row, p.dup ? 'dup' : '', 'div')).join('');
  const n = fresh.length;
  openPv(`
    <p class="note">В выписке ${pending.length} ${plural(pending.length, 'операция', 'операции', 'операций')}.${dups ? ` ${dups} уже есть в приложении, их пропущу.` : ''}</p>
    <div class="pair pv-pair">
      <div><span class="dot" style="background:var(--inc)"></span>Доходы<b>${fmt(inc)}</b></div>
      <div class="r"><span class="dot" style="background:var(--exp)"></span>Расходы<b>${fmt(exp)}</b></div>
    </div>
    <div class="pv-list">${items}</div>
    ${n ? `<button class="btn btn-main" id="pvImport">Добавить ${n} ${plural(n, 'операцию', 'операции', 'операций')}</button>`
        : '<p class="note">Новых операций нет: всё из этой выписки уже добавлено.</p>'}
    <p class="note" style="margin:14px 0 0">Категорию можно поменять после добавления: нажмите на операцию в списке.</p>`);
  const btn = document.getElementById('pvImport');
  if (btn) btn.onclick = doImport;
}

function doImport() {
  const fresh = pending.filter(p => !p.dup).map(p => p.row);
  tx.push(...fresh);
  const newest = fresh.reduce((m, r) => Math.max(m, r[4]), 0);
  if (newest) { const d = new Date(newest * 1000); viewY = d.getFullYear(); viewM = d.getMonth(); }
  persist(); haptic('success'); closeSheet(); render();
  if (tg) tg.showAlert(`Добавлено: ${fresh.length} ${plural(fresh.length, 'операция', 'операции', 'операций')}`);
}

function showParseFail() {
  openPv(`<p class="note" style="color:var(--ink)">В файле не нашлось операций.</p>
    <p class="note">Нужна выписка по счёту карты из СберОнлайн в формате PDF, не скриншот и не фото. Если файл верный, откройте распознанный текст и пришлите его разработчику: так получится настроить разбор под ваш формат.</p>
    <button class="btn btn-quiet" id="pvCopy" style="width:100%;margin-top:6px">Показать распознанный текст</button>
    <textarea id="pvText" class="field" style="display:none;height:200px;margin-top:10px;font-size:12px" readonly></textarea>`);
  document.getElementById('pvCopy').onclick = () => {
    const t = document.getElementById('pvText');
    t.value = lastLines.slice(0, 80).join('\n'); t.style.display = 'block'; t.select();
  };
}

function openPv(html) {
  document.getElementById('pvBody').innerHTML = html;
  document.getElementById('overlay').classList.add('show');
  document.getElementById('pvSheet').classList.add('show');
}

document.getElementById('importBtn').onclick = () => document.getElementById('fileInput').click();
document.getElementById('fileInput').onchange = e => {
  const f = e.target.files[0]; e.target.value = '';
  if (f) handleFile(f);
};
document.getElementById('pvClose').onclick = closeSheet;

load().then(render);
